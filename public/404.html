<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Nexora</title>
    <script>
      // SPA fallback for GitHub Pages: redirect to the app's hash route.
      // Works for both project pages (/nexora/) and custom domain apex (/).
      (function () {
        var path = location.pathname;
        var hash = location.hash || "";
        var search = location.search || "";
        var segs = path.split("/").filter(Boolean);
        // If we're under a project page like /nexora/..., preserve the first segment.
        var base = "/";
        if (segs.length > 0 && segs[0].length > 0 && segs[0] !== "index.html") {
          // Heuristic: first segment is the repo/project base unless it already matches an app route.
          base = "/" + segs[0] + "/";
          segs = segs.slice(1);
        }
        var redirect = location.origin + base + (hash || "#/" + segs.join("/") + search);
        location.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
