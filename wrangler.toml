# Cloudflare Worker config for the Fintrex Contractors API.
# (Internal worker name `nexora-api` is kept; it's just the
# deployment artifact, decoupled from the public brand.)
#
# Setup checklist (one-time):
#   1. npm install -D wrangler
#   2. npx wrangler login   (browser OAuth)
#   3. npx wrangler d1 list   → copy the UUID for the 'nexora' database
#   4. Replace `database_id = "TODO"` below with that UUID
#   5. Commit wrangler.toml (the UUID is not a secret)
#
# Deploy:
#   npm run deploy:worker        # deploys worker.js to nexora-api
#   npm run worker:tail          # live-tail logs
#   npm run worker:secret -- put BREVO_API_KEY     # set/rotate a secret
#
# Why we don't declare secrets in this file:
#   AUTH_SECRET, BREVO_API_KEY, VAPID_PRIVATE_KEY etc. are managed via
#   `wrangler secret put` so they never land in git.
#
# Plaintext vars convention (post-rebrand):
#   EMAIL_FROM is declared in [vars] below so the sender address is
#   versioned alongside the brand. APP_URL, ALLOWED_ORIGINS,
#   VAPID_PUBLIC_KEY, VAPID_SUBJECT remain in the Cloudflare dashboard
#   (declaring only EMAIL_FROM here adds/updates that var and leaves
#   the others untouched - confirmed by Cloudflare docs).

name = "nexora-api"
main = "worker.js"
compatibility_date = "2025-01-01"

# Keep the default *.workers.dev URL alive alongside the custom domain.
# Without this, declaring [[routes]] below auto-disables workers.dev
# and breaks any frontend still pointing at the old URL (samwisebc.com
# during the rebrand transition).
# IMPORTANT: this top-level key MUST appear BEFORE any [section] header,
# otherwise TOML parses it as part of the previous table (e.g. vars.workers_dev).
workers_dev = true

# Custom domain binding (added 2026-06 during Samwise → Fintrex rebrand).
# Reachable at https://api.fintrexcontractors.com in addition to the
# default https://nexora-api.bumbufilip22.workers.dev URL. Cloudflare
# auto-provisions the DNS record + SSL cert on deploy. Requires the
# `fintrexcontractors.com` zone to be in this Cloudflare account.
[[routes]]
pattern = "api.fintrexcontractors.com"
zone_name = "fintrexcontractors.com"
custom_domain = true

# Plaintext env vars managed in this file (versioned alongside the brand).
# Everything else (APP_URL, ALLOWED_ORIGINS, VAPID_*) stays in the
# Cloudflare dashboard.
[vars]
EMAIL_FROM = "Fintrex Contractors <noreply@fintrexcontractors.com>"

# D1 binding - env.DB in worker.js. Database itself was created via the
# dashboard ("nexora"). Get its UUID from `npx wrangler d1 list`.
[[d1_databases]]
binding = "DB"
database_name = "nexora"
database_id = "b9f5a8bb-38e2-4c60-b360-c331e4a3de96"

# R2 binding - env.BUCKET in worker.js. Bucket already exists.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nexora-projects"

# Scheduled triggers.
#   - 0 6 * * *  daily 06:00 UTC: document-expiry sweep. Sends the
#                14-day pre-expiry warning email + the at-expiry
#                alert (sub + admin), dedup'd via the
#                document_expiry_notifications table.
[triggers]
crons = ["0 6 * * *"]
